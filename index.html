<style>
:root{color-scheme:light dark;--bg:#f4f1ea;--sheet:#fffdf9;--g1:#f4f1ea;--g2:#f4f1ea;--g3:#f4f1ea;--card:#fffdf9;--tx:#22242a;--mut:#7a7a82;--bd:#e8e2d6;--sh:0 1px 0 rgba(0,0,0,.02),0 8px 24px -16px rgba(0,0,0,.15);--ac:#3e63dd;--acon:#fff;--on:#22242a;--warn:#e0384b;--c0:#b9c7f5;--c1:#f4b6bd;--c2:#a9dcc0;--c3:#f0d9a0;--r:20px;--rr:16px;--hf:inherit}
@media (prefers-color-scheme:dark){:root{--bg:#131418;--sheet:#1d1f25;--g1:#131418;--g2:#131418;--g3:#131418;--card:#1d1f25;--tx:#f1f1f4;--mut:#9b9ba5;--bd:#2b2e36;--sh:0 8px 24px -16px rgba(0,0,0,.7);--ac:#8aa2ff;--acon:#131418;--warn:#ff5d70}}
html[data-style="ninja"]{--ac:#e0384b;--acon:#fff;--r:10px;--rr:7px;--hf:"Songti TC","Noto Serif TC","Hiragino Mincho ProN",serif}
@media (prefers-color-scheme:dark){html[data-style="ninja"]{--ac:#e0384b;--acon:#fff}}
.spin{animation:spin .9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.shk-l{width:56px;height:56px;color:var(--ac);flex:none}
#splash{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .45s;animation:splashOut .45s 1.8s forwards}
#splash.off{opacity:0;pointer-events:none}
@keyframes splashOut{to{opacity:0;visibility:hidden;pointer-events:none}}
.ldr{width:88px;height:88px;position:relative;display:grid;place-items:center;color:var(--ac);flex:none}.ldr.s{width:56px;height:56px}
.ldr .ln{width:100%;height:100%;animation:spin .85s linear infinite;filter:drop-shadow(0 6px 10px rgba(0,0,0,.22))}
.ldr .lc{display:none;position:absolute;inset:0}
.ldr .lc i{position:absolute;inset:0;margin:auto;width:30%;height:30%;border-radius:50%;border:2px solid currentColor;opacity:0;animation:rip 2.4s ease-out infinite}
.ldr .lc i:nth-child(2){animation-delay:.8s}.ldr .lc i:nth-child(3){animation-delay:1.6s}
.ldr .lc::after{content:"";position:absolute;inset:36%;border-radius:50%;background:currentColor;animation:breathe 2.4s ease-in-out infinite}
@keyframes rip{0%{width:30%;height:30%;opacity:.65}100%{width:100%;height:100%;opacity:0}}
@keyframes breathe{50%{transform:scale(1.3)}}
html[data-style="calm"] .ldr .ln{display:none}html[data-style="calm"] .ldr .lc{display:block}
#splash b{font-family:var(--hf);letter-spacing:.3em;color:var(--tx);font-size:18px}
#upd,#busy{align-items:center;padding:24px}#upd{z-index:50}#busy{z-index:70}
.mc{width:min(100%,340px);text-align:center;display:grid;justify-items:center;gap:10px;padding:20px 18px;background:var(--sheet);animation:pop .35s cubic-bezier(.3,1.4,.5,1)}
.mc .two{width:100%}.mc p{margin:0}
@keyframes pop{from{opacity:0;transform:scale(.88) translateY(8px)}}
#upd .ldr .ln{animation-duration:6s}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:linear-gradient(160deg,var(--g1),var(--g2) 55%,var(--g3)) fixed;color:var(--tx);font:15px/1.45 -apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
html[data-style="ninja"] body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(circle at 90% 7%,rgba(224,56,75,.08) 0 64px,transparent 65px),radial-gradient(circle at 50% 100%,transparent 55%,rgba(236,230,216,.04) 56% 59%,transparent 60%) 0 0/46px 23px}
#app{position:relative;z-index:1;height:100vh;height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
::-webkit-scrollbar{display:none}
#pages{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.pg{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;padding:14px max(16px,calc((100% - 600px)/2)) 110px}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 12px}
html[data-style="ninja"] button{border-radius:7px}
button.pri{background:var(--ac);color:var(--acon);border-color:var(--ac)}
button.dg{color:var(--warn)}
.hd{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.hd h1{margin:0;font-size:26px;font-family:var(--hf);letter-spacing:.03em}
html[data-style="ninja"] .hd h1{letter-spacing:.08em}
.hd2{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.f1{flex:1;min-width:0}
.sub{color:var(--mut);margin:2px 0 0}
.ib{width:40px;height:40px;padding:0;border-radius:50%;font-size:17px;flex:none}
html[data-style="ninja"] .ib{border-radius:8px}
h2{font-size:16px;margin:18px 2px 8px;font-family:var(--hf)}
html[data-style="ninja"] h2::before{content:"";display:inline-block;width:4px;height:.9em;background:var(--ac);margin-right:8px;vertical-align:-1px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:12px}
.tc{display:flex;align-items:center;gap:14px;position:relative;overflow:hidden}
.tc .wm{position:absolute;right:-14px;top:-14px;width:96px;height:96px;opacity:.07;color:var(--ac);display:none}
html[data-style="ninja"] .tc .wm{display:block}
.big{font-size:17px;font-weight:600;font-family:var(--hf)}

/* ---------- media storage (IndexedDB) ---------- */
const idb=new Promise(r=>{try{const q=indexedDB.open("calmedia",1);q.onupgradeneeded=()=>q.result.createObjectStore("m");q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
const mput=async(id,b)=>{const d=await idb;if(!d)throw 0;return new Promise((y,n)=>{const t=d.transaction("m","readwrite");t.objectStore("m").put(b,id);t.oncomplete=y;t.onerror=()=>n(t.error);t.onabort=()=>n(t.error)})};
const mget=async id=>{const d=await idb;if(!d)return null;return new Promise(y=>{const q=d.transaction("m").objectStore("m").get(id);q.onsuccess=()=>y(q.result);q.onerror=()=>y(null)})};
const mdel=async id=>{const d=await idb;if(d)d.transaction("m","readwrite").objectStore("m").delete(id)};
const usedMedia=()=>new Set(S.ev.flatMap(e=>(e.media||[]).map(m=>m.id)));
const gc=ids=>{const u=usedMedia();ids.forEach(id=>{if(!u.has(id))mdel(id)})};
const shrink=f=>new Promise((y,n)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const k=Math.min(1,1280/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?y(b):n(),"image/jpeg",.8)};i.onerror=n;i.src=u});

/* ---------- events ---------- */
function occurs(e,d){
 if(e.skip&&e.skip.includes(d))return false;
 const last=e.endDate&&!e.rep?e.endDate:e.date;
 if(d>=e.date&&d<=last)return true;
 if(!e.rep||d<e.date||(e.until&&d>e.until))return false;
 const a=parse(e.date),b=parse(d);
 if(e.rep==="d")return true;
 if(e.rep==="w")return(e.days&&e.days.length?e.days:[a.getDay()]).includes(b.getDay());
 const dim=new Date(b.getFullYear(),b.getMonth()+1,0).getDate();
 if(Math.min(a.getDate(),dim)!==b.getDate())return false;
 return e.rep==="m"||a.getMonth()===b.getMonth();
}
const evOn=d=>S.ev.filter(e=>occurs(e,d)).sort((x,y)=>(x.time||"")<(y.time||"")?-1:(x.time||"")>(y.time||"")?1:0);
const isMulti=e=>!!(e.endDate&&!e.rep&&e.endDate>e.date);
const mapUrl=l=>"https://www.google.com/maps/search/?api=1&query="+(l.lat!=null?l.lat+","+l.lng:encodeURIComponent(l.name||""));
function repLabel(e){return{d:"每天",w:"每週"+(e.days&&e.days.length>1?"（"+e.days.map(i=>WD[i]).join("、")+"）":""),m:"每月",y:"每年"}[e.rep]}
function evRow(e,d){
 const r=el("div","row"),p=[];
 if(isMulti(e))p.push("第 "+(diff(e.date,d)+1)+"/"+(diff(e.date,e.endDate)+1)+" 天");
 if(e.rep)p.push(repLabel(e));
 if(e.loc&&(e.loc.name||e.loc.lat!=null))p.push(`<a href="${mapUrl(e.loc)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">📍 ${esc(e.loc.name||"地圖")}</a>`);
 if((e.media||[]).length)p.push("📎 "+e.media.length);
 if(e.remind!==""&&e.remind!=null)p.push("🔔");
 if(e.note)p.push(esc(e.note));
 const t2=e.end&&e.time?`<small>${e.end<=e.time&&!isMulti(e)?"次日 ":""}${e.end}</small>`:"";
 r.innerHTML=`<div class="tm">${e.time||"全天"}${t2}</div><span class="bar2" style="background:var(${CATS[e.cat][1]})"></span><div class="f1"><div>${esc(e.title)}</div>${p.length?`<div class="mut">${p.join(" · ")}</div>`:""}</div>`;
 r.onclick=()=>openEvent(e,d);return r;
}

/* ---------- calendar rendering ---------- */
function mgrid(y,m){const st=new Date(y,m,1-new Date(y,m,1).getDay()),t=today();let h="";
 for(let i=0;i<42;i++){const d=new Date(st.getFullYear(),st.getMonth(),st.getDate()+i),k=fmt(d),cs=[...new Set(evOn(k).map(e=>e.cat))].slice(0,3);
  h+=`<div class="day${d.getMonth()!==m?" out":""}${k===t?" today":""}${k===sel?" sel":""}" data-d="${k}"><b>${d.getDate()}</b><div class="dots">${cs.map(c=>`<s style="background:var(${CATS[c][1]})"></s>`).join("")}</div></div>`}
 return h}
function layout(items){items.sort((a,b)=>a.s-b.s||b.f-a.f);let cl=[],ends=[],cEnd=0;const flush=()=>{cl.forEach(x=>x.n=ends.length);cl=[];ends=[];cEnd=0};
 items.forEach(x=>{if(cl.length&&x.s>=cEnd)flush();let c=ends.findIndex(v=>v<=x.s);if(c<0){c=ends.length;ends.push(0)}ends[c]=x.f;x.c=c;cl.push(x);cEnd=Math.max(cEnd,x.f)});flush();return items}
function tline(days){
 const n=days.length,t=today(),now=new Date(),nm=now.getHours()*60+now.getMinutes(),evs=days.map(d=>evOn(d)),allf=e=>!e.time||isMulti(e);
 let h=`<div class="tlh" style="--n:${n}"><i></i>`+days.map(d=>{const D=parse(d);return`<div class="dh${d===t?" today":""}${d===sel?" sel":""}" data-d="${d}"><small>${WD[D.getDay()]}</small><b>${D.getDate()}</b></div>`}).join("")+`</div>`;
 if(evs.some(a=>a.some(allf)))h+=`<div class="tla" style="--n:${n}"><i>全天</i>`+days.map((d,i)=>`<div>`+evs[i].filter(allf).map(e=>`<span class="chip" data-e="${e.id}" data-d="${d}" style="background:var(${CATS[e.cat][1]})">${esc(e.title)}</span>`).join("")+`</div>`).join("")+`</div>`;
 h+=`<div class="tlb"><div class="tlg" style="--n:${n};height:${24*HH}px"><div class="hrs">`+[...Array(24).keys()].map(i=>`<span style="top:${i*HH}px">${i?pad(i)+":00":""}</span>`).join("")+`</div>`;
 days.forEach((d,i)=>{
  const items=layout(evs[i].filter(e=>!allf(e)).map(e=>{const s=toMin(e.time);let f=e.end?toMin(e.end):s+60;if(f<=s)f=e.end?1440:s+60;return{e,s,f:Math.min(f,1440)}}));
  h+=`<div class="col" data-d="${d}">`+items.map(x=>`<div class="blk" data-e="${x.e.id}" data-d="${d}" style="top:${x.s/60*HH}px;height:${Math.max(22,(x.f-x.s)/60*HH-2)}px;left:calc(${x.c/x.n*100}% + 1px);width:calc(${100/x.n}% - 2px);background:var(${CATS[x.e.cat][1]})"><b>${x.e.time}</b> ${esc(x.e.title)}</div>`).join("")+(d===t?`<i class="now" style="top:${nm/60*HH}px"></i>`:"")+`</div>`});
 return h+`</div></div>`;
}
function panelDays(o){if(ST.view==="d")return[addD(sel,o)];const s=weekStart(addD(sel,7*o));return[...Array(7)].map((_,i)=>addD(s,i))}
function calTitle(){const v=ST.view;if(v==="m")return cur.getFullYear()+" 年 "+(cur.getMonth()+1)+" 月";const D=parse(sel);if(v==="d")return(D.getMonth()+1)+" 月 "+D.getDate()+" 日 週"+WD[D.getDay()];const a=parse(weekStart(sel)),b=parse(addD(weekStart(sel),6));return a.getMonth()===b.getMonth()?(a.getMonth()+1)+" 月 "+a.getDate()+"–"+b.getDate()+" 日":(a.getMonth()+1)+"/"+a.getDate()+" – "+(b.getMonth()+1)+"/"+b.getDate()}

 $$("#seg button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));

 $("#agenda").classList.toggle("hide",v!=="m");
 if(v==="m")renderAgenda();

function renderAgenda(){const d=parse(sel),es=evOn(sel),l=$("#alist");
 $("#adate").textContent=(d.getMonth()+1)+" 月 "+d.getDate()+" 日 週"+WD[d.getDay()]+(sel===today()?" · 今天":"");
 l.innerHTML=es.length?"":`<div class="empty">${nj()?"今天風平浪靜 🍃":"這天很空閒 🌿"}<br>按右下角 ＋ 安排點什麼</div>`;es.forEach(e=>l.appendChild(evRow(e,sel)))}
function setView(v){ST.view=v;saveST();if(v==="m"){const D=parse(sel);cur=new Date(D.getFullYear(),D.getMonth(),1)}renderCal()}
function shift(dir){if(ST.view==="m")cur=new Date(cur.getFullYear(),cur.getMonth()+dir,1);else{sel=addD(sel,dir*(ST.view==="w"?7:1));const D=parse(sel);cur=new Date(D.getFullYear(),D.getMonth(),1)}}

/* ---------- today / todos ---------- */
function doneDates(){const s=new Set();S.mt.forEach(x=>x.done&&s.add(x.date));S.td.forEach(x=>x.done&&x.doneAt&&s.add(x.doneAt));return s}
function streak(){const s=doneDates();let d=today(),n=0;if(!s.has(d))d=addD(d,-1);while(s.has(d)){n++;d=addD(d,-1)}return n}
const pinCmp=(a,b)=>(b.pin?1:0)-(a.pin?1:0);
function lrow(x,key,due){
 const r=el("div","row"+(x.done?" done":"")),late=due&&!x.done&&x.due&&x.due<today();
 r.innerHTML=`<button class="ck${x.done?" on":""}">${x.done?"✓":""}</button><div class="f1 ed"><div class="t">${x.pin?"📌 ":""}${esc(x.text)}</div>${due&&x.due?`<div class="mut" style="${late?"color:var(--warn)":""}">${x.due}${late?" 已逾期":""}</div>`:""}</div><button class="x" aria-label="刪除">✕</button>`;
 r.querySelector(".ck").onclick=()=>{x.done=!x.done;if(x.done)x.doneAt=today();else delete x.doneAt;save();renderDay();renderTodos()};
 r.querySelector(".ed").onclick=()=>editItem(x,key);
 r.querySelector(".x").onclick=()=>{const i=S[key].indexOf(x);S[key].splice(i,1);save();renderDay();renderTodos();const n=note(`已刪除 <button class="ul">復原</button>`,5000);n.querySelector(".ul").onclick=()=>{S[key].splice(i,0,x);save();renderDay();renderTodos();n.remove()}};
 return r}
function renderDay(){
 const n=new Date(),t=fmt(n),h=n.getHours(),es=evOn(t),notes=S.mt.filter(x=>x.date===t),tds=S.td.filter(x=>x.due===t);
 const all=notes.length+tds.length,done=notes.filter(x=>x.done).length+tds.filter(x=>x.done).length,hm=pad(h)+":"+pad(n.getMinutes()),nx=es.find(e=>e.time&&e.time>=hm),st=streak();
 $("#hi").textContent=nj()?(h<5?"夜深了，影子也要休息 🥷":h<12?"晨曦出任務 🥷":h<18?"午後修行 🥷":"夜行時刻 🥷"):(h<5?"夜深了，早點休息 🌙":h<12?"早安 ☀️":h<18?"午安 🌿":"晚安 🌙");
 $("#hs").textContent=(n.getMonth()+1)+" 月 "+n.getDate()+" 日 週"+WD[n.getDay()];
 $("#sec-ev").textContent=nj()?"今日任務":"今日行程";
 $("#ring").setAttribute("stroke-dasharray",(all?done/all:0)*163.4+" 163.4");$("#rtx").textContent=all?done+"/"+all:"0";
 $("#rmsg").textContent=!all?(nj()?"先寫下今天的第一個任務":"從一件小事開始吧"):done===all?(nj()?"任務完成，隱身收刀 🥷":"今天全部完成，真棒 🎉"):(nj()?"還剩 "+(all-done)+" 項，穩住":"還剩 "+(all-done)+" 件，慢慢來");
 $("#rnx").textContent=nx?"下一個："+nx.time+" "+nx.title:es.length?"今天的行程都結束了":"今天沒有行程";
 $("#rst").textContent=st?(nj()?`🔥 連續修行 ${st} 天`:`🔥 連續 ${st} 天有完成事項`):"";
 if(ST.style==="jjk"){["#hi","#rmsg"].forEach(q=>{$(q).textContent=$(q).textContent.replace(/🥷/g,"🌀")})}
 const l=$("#dlist");l.innerHTML=es.length?"":`<div class="empty">${nj()?"今天風平浪靜 🍃":"今天沒有行程 ☁️"}</div>`;es.forEach(e=>l.appendChild(evRow(e,t)));
 $("#mh").textContent="今日筆記本"+(notes.length?"（"+notes.filter(x=>x.done).length+"/"+notes.length+"）":"");
 const m=$("#mlist");m.innerHTML="";[...notes].sort((a,b)=>pinCmp(a,b)||a.done-b.done).forEach(x=>m.appendChild(lrow(x,"mt")));
 let b="";const days=Math.floor((Date.now()-ST.lastBackup)/864e5);
 if((S.ev.length+S.td.length)>0&&(!ST.lastBackup||days>=7)&&!ST.bkOff&&Date.now()>(ST.bkSnooze||0))b+=`<div class="banner" style="flex-wrap:wrap"><span>🗂 ${ST.lastBackup?"已 "+days+" 天沒備份":"還沒備份過"}，資料只存在這台裝置</span><button class="pri" id="bn-bk">備份</button><button id="bn-bk-l">稍後</button><button id="bn-bk-n">不再提醒</button></div>`;
 if(newVer)b+=`<div class="banner"><span>✨ 有新版本</span><button class="pri" id="bn-up">立即更新</button></div>`;
 $("#banners").innerHTML=b;
 const bk=$("#bn-bk");if(bk)bk.onclick=doBackup;const bl=$("#bn-bk-l");if(bl)bl.onclick=()=>{ST.bkSnooze=Date.now()+7*864e5;saveST();renderDay()};const bn=$("#bn-bk-n");if(bn)bn.onclick=()=>{ST.bkOff=1;saveST();renderDay();note("好，不再提醒。想備份時到 ⚙️ 設定按「備份」",4500)};const up=$("#bn-up");if(up)up.onclick=applyUpdate;
}

/* ---------- generic sheet swipe-to-close (down on the handle, or sideways) ---------- */
function swipeClose(sh,grip,close){
 let y0=null,dy=0,x0=null,y1=0,m=null,dx=0;
 grip.addEventListener("touchstart",e=>{y0=e.touches[0].clientY;dy=0;sh.style.transition="none"},{passive:true});

 const vend=()=>{if(y0===null)return;y0=null;const far=dy>110;dy=0;sh.style.transition="transform .22s ease-out";sh.style.transform=far?"translateY(100%)":"";if(far)setTimeout(()=>{close();sh.style.transform="";sh.style.transition=""},200)};

 <h2>備份</h2><div class="card sg"><div class="mut">上次備份：${bk}</div><div class="two"><button id="s-bk" class="pri">備份到檔案</button><button id="s-im">匯入備份</button></div><div class="mut">按「備份」會跳出分享選單，選「儲存到檔案」再選 iCloud Drive，換 iPad 時用「匯入備份」就能還原。照片會一起備份，影片太大不包含，請留相簿原檔。</div></div>
 <h2>提醒與 iOS 行事曆</h2><div class="card sg"><div class="mut">網頁版沒辦法在背景響鈴。把行程加進 iOS 行事曆，就會用系統的提醒。單一行程可在編輯畫面按「🔔 加到 iOS 行事曆」。</div><button id="s-ics">把全部行程匯出到 iOS 行事曆</button></div>
 <h2>位置</h2><div class="card sg"><button id="s-loc">重新詢問位置權限</button><div class="mut">如果之前選了「不允許」，網頁無法再詢問，要到 iPad「設定 → 隱私權與安全性 → 定位服務 → Safari 網站」改成「使用 App 期間」。</div><div class="mut" id="s-lm"></div></div>
 <h2>儲存空間</h2><div class="card sg"><div class="mut" id="s-st">讀取中…</div><button id="s-pe">開啟資料保護</button><div class="mut">加到主畫面使用最安全；資料保護可降低 Safari 自動清掉資料的機會。</div></div>
 <h2>版本</h2><div class="card sg"><div class="mut">目前版本：${VER}</div><button id="s-up">檢查更新</button><button id="s-ob">重新看歡迎說明</button></div>`);
 $$(".seg [data-s]").forEach(b=>{b.classList.toggle("on",b.dataset.s===ST.style);b.onclick=()=>{setStyle(b.dataset.s);$$(".seg [data-s]").forEach(x=>x.classList.toggle("on",x.dataset.s===ST.style))}});
 $("#s-bk").onclick=doBackup;$("#s-im").onclick=()=>$("#imp").click();
 $("#s-ics").onclick=async()=>{if(!S.ev.length){note("還沒有行程");return}const ok=await outFile("行事曆.ics",icsWrap(S.ev),"text/calendar");if(ok)note("存到「檔案」後點開，再按「加入全部」",6000)};
 $("#s-loc").onclick=async()=>{try{await getPos();$("#s-lm").textContent="✅ 位置可用"}catch(err){$("#s-lm").textContent=geoMsg(err)}};
 const refresh=async()=>{const i=await storageInfo();$("#s-st").textContent="已用 "+(i.u||"無法讀取")+(i.p?" · "+i.p:"")};refresh();
 $("#s-pe").onclick=async()=>{ST.pe=1;saveST();const ok=await persist();note(ok?"已開啟資料保護":"Safari 沒有同意（把網站加到主畫面通常就會受保護）",4500);refresh()};
 $("#s-up").onclick=()=>checkUpdate(true);$("#s-ob").onclick=()=>{closePanel();showOnboard()};
}
$("#b-search").onclick=$("#b-search2").onclick=openSearch;$("#b-hist").onclick=openHistory;$("#b-set").onclick=openSettings;

/* ---------- style ---------- */
function setStyle(s){ST.style=s;saveST();applyStyle()}
function applyStyle(){document.documentElement.dataset.style=ST.style;$("#tc").content=ST.style==="jjk"?"#0a0a15":matchMedia("(prefers-color-scheme:dark)").matches?"#131418":"#f4f1ea";renderAll()}

/* ---------- first-run welcome ---------- */
function showOnboard(){
 const o=$("#ob");
 o.innerHTML=`<div class="sheet"><div class="shh"><b>${nj()?(ST.style==="jjk"?"🌀":"🥷")+" 歡迎，先設定兩件事":"歡迎使用，先設定兩件事"}</b></div>
 <div class="card sg"><b>① 位置（用 Google 地圖）</b><div class="mut">行程可以記下地點，並在 Google 地圖開啟。想用再按「允許」，Safari 會問你；不想用可以按「略過」，其他功能照常使用，之後想開再到設定。</div><div class="two"><button id="ob-loc-no">略過</button><button id="ob-loc">允許使用位置</button></div><div class="mut" id="ob-lm"></div><div class="mut">之後想改，請到 iPad「設定 → 隱私權與安全性 → 定位服務 → Safari 網站」調整。</div></div>
 <div class="card sg"><b>② 資料保護</b><div class="mut">行程只存在這台裝置。建議加到主畫面使用，並到「設定」定期備份。</div><div class="two"><button id="ob-pe-no">略過</button><button id="ob-pe">開啟資料保護</button></div><div class="mut" id="ob-pm"></div></div>
 <button class="pri" id="ob-go">開始使用</button><div class="mut" style="text-align:center">兩項都不是必要的，略過也能正常使用。</div></div>`;
 o.classList.remove("hide");
 $("#ob-loc").onclick=async()=>{try{await getPos();$("#ob-lm").textContent="✅ 已允許"}catch(err){$("#ob-lm").textContent=geoMsg(err)}};
 $("#ob-loc-no").onclick=()=>{$("#ob-lm").textContent="已略過，要用時按行程裡的 📍 或到設定開啟";$("#ob-loc").classList.add("hide");$("#ob-loc-no").classList.add("hide")};
 $("#ob-pe").onclick=async()=>{ST.pe=1;saveST();$("#ob-pm").textContent=(await persist())?"✅ 已開啟":"Safari 這次沒有同意，加到主畫面後通常就會受保護"};
 $("#ob-pe-no").onclick=()=>{$("#ob-pm").textContent="已略過，之後可在「設定」開啟";$("#ob-pe").classList.add("hide");$("#ob-pe-no").classList.add("hide")};
 $("#ob-go").onclick=()=>{ST.onboard=1;saveST();o.classList.add("hide");o.innerHTML=""};
}

/* ---------- update check ---------- */
let newVer=false,newVerStr="",updNo=false,lastChk=0;
const busy=t=>{$("#busy-t").textContent=t;$("#busy").classList.remove("hide")},busyOff=()=>$("#busy").classList.add("hide");
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function checkUpdate(manual){
 if(manual)busy("檢查更新中…");
 try{const u=location.href.split("#")[0].split("?")[0],r=await fetch(u+"?nc="+Date.now(),{cache:"no-store"}),t=await r.text(),m=t.match(/\bVER="([\d.\-]+)"/);lastChk=Date.now();
  if(manual)await sleep(700);
  if(m&&m[1]!==VER){newVer=true;newVerStr=m[1];updNo=false;renderDay();if(manual)busyOff();showUpd()}else{if(manual){busyOff();note("已是最新版 ✓")}}}
 catch(e){if(manual){busyOff();note("目前無法檢查更新")}}}
function showUpd(){
 if(!newVer||updNo||!$("#upd").classList.contains("hide"))return;
 if(["#ov","#dlg","#act","#lb"].some(i=>$(i)&&!$(i).classList.contains("hide")))return;
 $("#upd-t").textContent="新版本 "+newVerStr+"（目前 "+VER+"）。更新後你的行程和筆記都會保留。";$("#upd").classList.remove("hide")}
$("#upd-no").onclick=()=>{updNo=true;$("#upd").classList.add("hide")};
$("#upd-go").onclick=()=>{$("#upd").classList.add("hide");applyUpdate()};
async function applyUpdate(){
 busy("更新中…");const base=location.href.split("#")[0].split("?")[0];
 try{if(window.caches)(await caches.keys()).forEach(k=>caches.delete(k))}catch(e){}
 try{await fetch(base,{cache:"reload"})}catch(e){}
 await sleep(700);location.replace(base+"?v="+Date.now())}

/* ---------- in-app reminders (only while the app is open) ---------- */
const fired=new Set();
function tick(){if(document.hidden)return;const n=new Date(),t=fmt(n),mins=n.getHours()*60+n.getMinutes();
 evOn(t).forEach(e=>{if(!e.time||e.remind===""||e.remind==null)return;const st=toMin(e.time),k=e.id+"|"+t;if(fired.has(k))return;if(mins>=st-e.remind&&mins<=st+5){fired.add(k);note(`⏰ ${e.time} ${esc(e.title)}${st>mins?"（"+(st-mins)+" 分鐘後）":""}`,0)}})}
setInterval(tick,30000);setInterval(()=>{if(!document.hidden&&/^https?:/.test(location.protocol)){if(!newVer&&Date.now()-lastChk>30*60e3)checkUpdate(false);showUpd()}},30000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){renderAll();tick();if(/^https?:/.test(location.protocol)&&Date.now()-lastChk>5*60e3)checkUpdate(false)}});

applyStyle();
setTimeout(()=>{const sp=$("#splash");if(sp){sp.classList.add("off");setTimeout(()=>sp.remove(),500)}},1000);
requestAnimationFrame(()=>{snap(P,1);center()});
setTimeout(()=>{if(!ST.onboard)showOnboard()},400);
if(ST.onboard&&ST.pe&&navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if(/^https?:/.test(location.protocol)){setTimeout(()=>checkUpdate(false),1500);if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script></body></html>
