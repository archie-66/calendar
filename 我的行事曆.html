<style>
:root{--bg:#f1f4f2;--sheet:#fbfaf7;--g1:#e6f2ec;--g2:#eee9fa;--g3:#fdeee6;--card:rgba(255,255,255,.78);--tx:#2f3a3a;--mut:#7b8785;--bd:rgba(120,140,135,.2);--sh:0 2px 10px rgba(80,110,100,.09);--ac:#5a9a92;--acon:#fff;--on:#2e3338;--c0:#a8c8f0;--c1:#f5b9a8;--c2:#b3dcc1;--c3:#cdc3ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12181d;--sheet:#1b242b;--g1:#12201f;--g2:#171a2b;--g3:#211b25;--card:rgba(34,46,56,.72);--tx:#e9efed;--mut:#98a7a4;--bd:rgba(255,255,255,.09);--sh:0 2px 10px #0004;--ac:#7fc1b6;--acon:#10201d;--on:#1d2026;--c0:#8fb6ea;--c1:#f0a592;--c2:#9fd1ae;--c3:#b9acea}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12181d;--sheet:#1b242b;--g1:#12201f;--g2:#171a2b;--g3:#211b25;--card:rgba(34,46,56,.72);--tx:#e9efed;--mut:#98a7a4;--bd:rgba(255,255,255,.09);--sh:0 2px 10px #0004;--ac:#7fc1b6;--acon:#10201d;--on:#1d2026;--c0:#8fb6ea;--c1:#f0a592;--c2:#9fd1ae;--c3:#b9acea}
*{box-sizing:border-box}
html,body{margin:0}
body{background:linear-gradient(160deg,var(--g1),var(--g2) 55%,var(--g3)) fixed;color:var(--tx);font:15px/1.4 -apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;padding-bottom:84px}
.wrap{max-width:560px;margin:0 auto;padding:12px}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bar h1{flex:1;font-size:19px;margin:0}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:7px 12px}
button.pri{background:var(--ac);color:var(--acon);border-color:var(--ac)}
.wk,.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.wk div{text-align:center;color:var(--mut);font-size:12px;padding:4px 0}
.grid{gap:2px}
.day{background:var(--card);border:1px solid var(--bd);border-radius:12px;min-height:68px;padding:4px;overflow:hidden;box-shadow:var(--sh)}
.day b{font-size:12px;font-weight:600}
.day.out{opacity:.4}
.day.today b{background:var(--ac);color:var(--acon);border-radius:9px;padding:0 6px}
.day.sel{outline:2px solid var(--ac);background:color-mix(in srgb,var(--ac) 14%,var(--card))}
.day i{display:block;font-style:normal;font-size:10px;color:var(--on);border-radius:6px;padding:1px 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day small{color:var(--mut);font-size:10px}
h2{font-size:16px;margin:16px 0 8px}
.hero{padding:6px 2px 12px}.hero b{display:block;font-size:22px}.hero span{color:var(--mut);font-size:13px}
.row{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--sh)}
.row>div{flex:1;min-width:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.mut{color:var(--mut);font-size:13px}
.done .t{text-decoration:line-through;color:var(--mut)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--bd);padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;border:0;background:none;color:var(--mut)}
.tabs button.on{color:var(--ac);font-weight:600}
.fab{position:fixed;right:18px;bottom:calc(70px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;font-size:26px;padding:0;box-shadow:0 2px 8px #0003}
.hide{display:none!important}
.ov{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{transition:transform .2s;max-height:92%;overflow-y:auto;overscroll-behavior:contain;background:var(--sheet);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px}
input,select,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cats{display:flex;gap:6px}
.cats button{flex:1;padding:6px 0}
.cats button.on{color:var(--on);border-color:transparent}
label.mut{display:block}label.mut input{margin-top:3px;color:var(--tx)}
.grip{height:28px;margin:-6px 0 -6px;touch-action:none}.grip::after{content:"";display:block;width:44px;height:5px;border-radius:3px;background:var(--mut);opacity:.45;margin:8px auto 0}
</style></head>

<div id="ptodo" class="hide">
 <h2>待辦清單</h2>
 <div class="two" style="grid-template-columns:1fr auto auto"><input id="tt" placeholder="新增待辦…"><input id="td" type="date" style="width:auto"><button class="pri" id="tadd">新增</button></div>
 <div id="tlist" style="margin-top:10px"></div>
</div>
</div>
<button class="pri fab" id="fab">＋</button>
<div class="tabs"><button id="b0">今日</button><button id="b1" class="on">月曆</button><button id="b2">待辦</button></div>
<div class="ov hide" id="ov"><div class="sheet" id="sheet"><div class="grip" id="grip"></div>
 <input id="f-title" placeholder="行程名稱">
 <input id="f-date" type="date">
 <div class="two"><label class="mut">開始時間<input id="f-time" type="time"></label><label class="mut">結束時間（選填）<input id="f-end" type="time"></label></div>
 <div class="cats" id="cats"></div>
 <select id="f-rep"><option value="">不重複</option><option value="w">每週重複（可選星期）</option><option value="m">每月重複</option><option value="y">每年重複</option></select>
 <div class="cats hide" id="wk-days"></div>
 <label class="mut hide" id="f-until-w">重複到哪天（選填，不填就一直重複）<input id="f-until" type="date"></label>
 <textarea id="f-note" rows="2" placeholder="備註（選填）"></textarea>
 <div class="two"><button id="f-del" class="hide">刪除</button><button id="f-no">取消</button></div>
 <button class="pri" id="f-ok">儲存</button>
</div></div>
<script>
const CATS=[["學習","--c0"],["申請","--c1"],["運動","--c2"],["其他","--c3"]];
const $=s=>document.querySelector(s);
let S={ev:[],td:[]};
try{S=JSON.parse(localStorage.getItem("cal1"))||S}catch(e){}
S.ev=S.ev||[];S.td=S.td||[];S.mt=S.mt||[];
const save=()=>{try{localStorage.setItem("cal1",JSON.stringify(S))}catch(e){}};
const pad=n=>String(n).padStart(2,"0");
const fmt=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let cur=new Date();cur.setDate(1);
let sel=fmt(new Date()),editing=null,cat=0;
function occurs(e,d){
 if(e.date===d)return true;
 if(d<e.date||!e.rep||(e.until&&d>e.until))return false;
 const a=parse(e.date),b=parse(d);
 if(e.rep==="w")return (e.days&&e.days.length?e.days:[a.getDay()]).includes(b.getDay());
 if(e.rep==="m")return a.getDate()===b.getDate();
 return a.getDate()===b.getDate()&&a.getMonth()===b.getMonth();
}
const evOn=d=>S.ev.filter(e=>occurs(e,d)).sort((x,y)=>(x.time||"")<(y.time||"")?-1:1);
function render(){
 $("#ttl").textContent=cur.getFullYear()+" 年 "+(cur.getMonth()+1)+" 月";
 const g=$("#grid");g.innerHTML="";
 const st=new Date(cur);st.setDate(1-st.getDay());
 const today=fmt(new Date());
 for(let i=0;i<42;i++){
  const d=new Date(st);d.setDate(st.getDate()+i);const k=fmt(d);
  const c=document.createElement("div");
  c.className="day"+(d.getMonth()!==cur.getMonth()?" out":"")+(k===today?" today":"")+(k===sel?" sel":"");
  const es=evOn(k);
  c.innerHTML="<b>"+d.getDate()+"</b>"+es.slice(0,2).map(e=>'<i style="background:var('+CATS[e.cat][1]+')">'+(e.time?e.time+" ":"")+esc(e.title)+"</i>").join("")+(es.length>2?"<small>+"+(es.length-2)+"</small>":"");
  c.onclick=()=>{sel=k;render()};
  g.appendChild(c);
 }
 const d=parse(sel);
 $("#adate").textContent=(d.getMonth()+1)+" 月 "+d.getDate()+" 日 週"+"日一二三四五六"[d.getDay()];
 const es=evOn(sel),l=$("#alist");
 l.innerHTML=es.length?"":'<p class="mut">這天沒有行程，按右下角 ＋ 新增</p>';
 es.forEach(e=>{
  const r=document.createElement("div");r.className="row";
  r.innerHTML='<span class="dot" style="background:var('+CATS[e.cat][1]+')"></span><div><div>'+esc(e.title)+'</div><div class="mut">'+(e.time?e.time+(e.end?"–"+e.end:""):"全天")+(e.rep?" · 重複"+(e.rep==="w"&&e.days&&e.days.length>1?"（週"+e.days.map(i=>"日一二三四五六"[i]).join("、")+"）":""):"")+(e.note?" · "+esc(e.note):"")+"</div></div>";
  r.onclick=()=>openEv(e);l.appendChild(r);
 });
 renderTodos();renderDay();
}
function renderTodos(){
 const l=$("#tlist");l.innerHTML="";
 [...S.td].sort((a,b)=>(a.done-b.done)||((a.due||"9")<(b.due||"9")?-1:1)).forEach(t=>{
  const r=document.createElement("div");r.className="row"+(t.done?" done":"");
  const late=!t.done&&t.due&&t.due<fmt(new Date());
  r.innerHTML='<input type="checkbox" style="width:auto"'+(t.done?" checked":"")+'><div><div class="t">'+esc(t.text)+'</div>'+(t.due?'<div class="mut" style="'+(late?"color:var(--c1)":"")+'">'+t.due+(late?" 已逾期":"")+"</div>":"")+'</div><button>✕</button>';
  r.querySelector("input").onchange=()=>{t.done=!t.done;save();renderTodos()};
  r.querySelector("button").onclick=()=>{S.td=S.td.filter(x=>x!==t);save();renderTodos()};
  l.appendChild(r);
 });
}
function setCat(i){cat=i;[...$("#cats").children].forEach((b,j)=>{b.className=j===i?"on":"";b.style.background=j===i?"var("+CATS[j][1]+")":""})}
CATS.forEach((c,i)=>{const b=document.createElement("button");b.textContent=c[0];b.onclick=()=>setCat(i);$("#cats").appendChild(b)});
function openEv(e){
 editing=e||null;
 $("#f-title").value=e?e.title:"";
 $("#f-date").value=e?e.date:sel;
 $("#f-time").value=e?e.time:"";
 $("#f-end").value=e?e.end||"":"";
 $("#f-rep").value=e?e.rep:"";
 wdays=e&&e.days?[...e.days]:[];
 if(e&&e.rep==="w"&&!wdays.length)wdays=[parse(e.date).getDay()];
 $("#f-until").value=e?e.until||"":"";
 repUI();paintDays();
 $("#f-note").value=e?e.note:"";
 setCat(e?e.cat:0);
 $("#f-del").classList.toggle("hide",!e);
 $("#ov").classList.remove("hide");
 $("#f-title").focus();
}
const closeEv=()=>$("#ov").classList.add("hide");
let wdays=[];
"日一二三四五六".split("").forEach((t,i)=>{const b=document.createElement("button");b.textContent=t;b.onclick=()=>{wdays=wdays.includes(i)?wdays.filter(x=>x!==i):[...wdays,i];paintDays()};$("#wk-days").appendChild(b)});
function paintDays(){[...$("#wk-days").children].forEach((b,i)=>{const on=wdays.includes(i);b.className=on?"on":"";b.style.background=on?"var(--ac)":"";b.style.color=on?"var(--acon)":""})}
function repUI(){const r=$("#f-rep").value;$("#wk-days").classList.toggle("hide",r!=="w");$("#f-until-w").classList.toggle("hide",!r)}
$("#f-rep").onchange=()=>{if($("#f-rep").value==="w"&&!wdays.length){wdays=[parse($("#f-date").value||sel).getDay()];paintDays()}repUI()};
(function(){
 const sh=$("#sheet");let y0=null,dy=0;
 sh.addEventListener("touchstart",e=>{if(e.target.closest("input,textarea,select,button,label")||sh.scrollTop>0)return;y0=e.touches[0].clientY;dy=0;sh.style.transition="none"},{passive:true});
 sh.addEventListener("touchmove",e=>{if(y0===null)return;dy=Math.max(0,e.touches[0].clientY-y0);sh.style.transform="translateY("+dy+"px)"},{passive:true});
 const end=()=>{if(y0===null)return;y0=null;sh.style.transition="";const far=dy>90;sh.style.transform="";dy=0;if(far)closeEv()};
 sh.addEventListener("touchend",end);sh.addEventListener("touchcancel",end);
 $("#ov").addEventListener("click",e=>{if(e.target===$("#ov"))closeEv()});
})();
$("#f-no").onclick=closeEv;
$("#f-ok").onclick=()=>{
 const title=$("#f-title").value.trim(),date=$("#f-date").value;
 if(!title||!date){$("#f-title").focus();return}
 const rep=$("#f-rep").value;
 const o={title,date,time:$("#f-time").value,end:$("#f-end").value,cat,rep,days:rep==="w"?[...wdays]:[],until:rep?$("#f-until").value:"",note:$("#f-note").value.trim()};
 if(o.end&&o.time&&o.end<=o.time)o.end="";
 if(editing)Object.assign(editing,o);else S.ev.push({id:Date.now(),...o});
 save();closeEv();sel=date;cur=parse(date);cur.setDate(1);render();
};
$("#f-del").onclick=()=>{S.ev=S.ev.filter(x=>x!==editing);save();closeEv();render()};
$("#prev").onclick=()=>{cur.setMonth(cur.getMonth()-1);render()};
$("#next").onclick=()=>{cur.setMonth(cur.getMonth()+1);render()};
$("#tod").onclick=()=>{cur=new Date();cur.setDate(1);sel=fmt(new Date());render()};
$("#fab").onclick=()=>{if(curTab===0)sel=fmt(new Date());openEv(null)};
$("#tadd").onclick=()=>{
 const t=$("#tt").value.trim();if(!t)return;
 S.td.push({id:Date.now(),text:t,done:false,due:$("#td").value});
 $("#tt").value="";$("#td").value="";save();renderTodos();
};
var curTab=1;
function tab(n){curTab=n;window.scrollTo(0,0);
 $("#pday").classList.toggle("hide",n!==0);$("#pcal").classList.toggle("hide",n!==1);$("#ptodo").classList.toggle("hide",n!==2);
 $("#fab").classList.toggle("hide",n===2);
 $("#b0").className=n===0?"on":"";$("#b1").className=n===1?"on":"";$("#b2").className=n===2?"on":"";if(n===0)renderDay();
}
$("#b0").onclick=()=>tab(0);$("#b1").onclick=()=>tab(1);$("#b2").onclick=()=>tab(2);
function renderDay(){
 const t=fmt(new Date()),es=evOn(t),l=$("#dlist");
 l.innerHTML=es.length?"":'<p class="mut">今天沒有行程，按右下角 ＋ 新增</p>';
 es.forEach(e=>{const r=document.createElement("div");r.className="row";r.innerHTML='<span class="dot" style="background:var('+CATS[e.cat][1]+')"></span><div><div>'+esc(e.title)+'</div><div class="mut">'+(e.time?e.time+(e.end?"–"+e.end:""):"全天")+'</div></div>';r.onclick=()=>openEv(e);l.appendChild(r)});
 const m=$("#mlist");m.innerHTML="";
 const k=S.mt.filter(x=>x.date===t);
 $("#mh").textContent="今日筆記本"+(k.length?"（"+k.filter(x=>x.done).length+"/"+k.length+"）":"");
 [...k].sort((a,b)=>a.done-b.done).forEach(x=>{
  const r=document.createElement("div");r.className="row"+(x.done?" done":"");
  r.innerHTML='<input type="checkbox" style="width:auto"'+(x.done?" checked":"")+'><div class="t">'+esc(x.text)+'</div><button>✕</button>';
  r.querySelector("input").onchange=()=>{x.done=!x.done;save();renderDay()};
  r.querySelector("button").onclick=()=>{S.mt=S.mt.filter(y=>y!==x);save();renderDay()};
  m.appendChild(r);
 });
}
$("#madd").onclick=()=>{const t=$("#mt").value.trim();if(!t)return;S.mt.push({id:Date.now(),text:t,done:false,date:fmt(new Date())});$("#mt").value="";save();renderDay()};
$("#mt").addEventListener("keydown",e=>{if(e.key==="Enter")$("#madd").click()});
(function(){
 let x0=null,y0=null,inGrid=false;
 document.addEventListener("touchstart",e=>{
  if(!$("#ov").classList.contains("hide")||e.target.closest("input,textarea,select")){x0=null;return}
  x0=e.touches[0].clientX;y0=e.touches[0].clientY;inGrid=!!e.target.closest("#grid,.wk,.bar");
 },{passive:true});
 document.addEventListener("touchend",e=>{
  if(x0===null)return;
  const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;
  if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.5)return;
  const dir=dx<0?1:-1;
  if(inGrid&&curTab===1){cur.setMonth(cur.getMonth()+dir);render();return}
  const n=curTab+dir;if(n>=0&&n<=2)tab(n);
 },{passive:true});
})();
{const n=new Date(),h=n.getHours();$("#hi").textContent=h<5?"夜深了，早點休息 🌙":h<12?"早安 ☀️":h<18?"午安 🌿":"晚安 🌙";$("#hs").textContent=(n.getMonth()+1)+" 月 "+n.getDate()+" 日 週"+"日一二三四五六"[n.getDay()]+" · 今天有 "+evOn(fmt(n)).length+" 個行程"}
render();
</script></body></html>
