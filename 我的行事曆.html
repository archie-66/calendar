<style>
:root{--bg:#f1f4f2;--sheet:#fbfaf7;--g1:#e6f2ec;--g2:#eee9fa;--g3:#fdeee6;--card:rgba(255,255,255,.8);--tx:#2f3a3a;--mut:#7b8785;--bd:rgba(120,140,135,.2);--sh:0 2px 12px rgba(80,110,100,.09);--ac:#5a9a92;--acon:#fff;--on:#2e3338;--warn:#d0705a;--c0:#a8c8f0;--c1:#f5b9a8;--c2:#b3dcc1;--c3:#cdc3ee}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12181d;--sheet:#1b242b;--g1:#12201f;--g2:#171a2b;--g3:#211b25;--card:rgba(34,46,56,.72);--tx:#e9efed;--mut:#98a7a4;--bd:rgba(255,255,255,.09);--sh:0 2px 12px #0004;--ac:#7fc1b6;--acon:#10201d;--on:#1d2026;--warn:#f0a592;--c0:#8fb6ea;--c1:#f0a592;--c2:#9fd1ae;--c3:#b9acea}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12181d;--sheet:#1b242b;--g1:#12201f;--g2:#171a2b;--g3:#211b25;--card:rgba(34,46,56,.72);--tx:#e9efed;--mut:#98a7a4;--bd:rgba(255,255,255,.09);--sh:0 2px 12px #0004;--ac:#7fc1b6;--acon:#10201d;--on:#1d2026;--warn:#f0a592;--c0:#8fb6ea;--c1:#f0a592;--c2:#9fd1ae;--c3:#b9acea}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:linear-gradient(160deg,var(--g1),var(--g2) 55%,var(--g3)) fixed;color:var(--tx);font:15px/1.45 -apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
::-webkit-scrollbar{display:none}
#pages{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.pg{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;padding:14px max(16px,calc((100% - 560px)/2)) 100px}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 12px}
button.pri{background:var(--ac);color:var(--acon);border-color:var(--ac)}
.hd{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.hd h1{flex:1;margin:0;font-size:26px}
.sub{color:var(--mut);margin:-8px 0 12px}
h2{font-size:16px;margin:18px 2px 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;box-shadow:var(--sh);padding:12px}
.tc{display:flex;align-items:center;gap:14px}
.big{font-size:17px;font-weight:600}
.f1{flex:1;min-width:0}
.mut{color:var(--mut);font-size:13px}.mut a{color:var(--ac)}
.row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--bd);margin-bottom:8px;box-shadow:var(--sh)}
.tm{width:46px;text-align:right;color:var(--mut);font-size:13px;flex:none}
.bar2{width:4px;align-self:stretch;border-radius:2px;flex:none}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--mut);background:none;padding:0;flex:none;color:var(--acon);font-size:15px;line-height:1}
.ck.on{background:var(--ac);border-color:var(--ac);animation:pop .25s}
@keyframes pop{50%{transform:scale(1.25)}}
.done .t{text-decoration:line-through;color:var(--mut)}.done{opacity:.75}
.x{border:0;background:none;color:var(--mut);padding:4px 8px}
.empty{text-align:center;color:var(--mut);padding:22px 0}
.add{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:6px}
.add.d3{grid-template-columns:1fr auto auto}
input,select,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px;width:100%}
summary{margin:10px 2px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;color:var(--mut);font-size:12px;padding-bottom:4px}
#ms{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none}
.mp{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.day{display:flex;flex-direction:column;align-items:center;padding:4px 0;border-radius:14px}
.day b{width:32px;height:32px;line-height:32px;border-radius:50%;text-align:center;font-weight:500}
.day.out{opacity:.35}.day.today b{color:var(--ac);font-weight:800}
.day.sel b{background:var(--ac);color:var(--acon)}
.dots{display:flex;gap:3px;height:6px;margin-top:3px}.dots s{width:6px;height:6px;border-radius:50%}
.tabs{position:relative;display:flex;width:min(100% - 32px,560px);margin:0 auto calc(8px + env(safe-area-inset-bottom,0px));padding:4px;background:var(--card);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--bd);border-radius:22px;box-shadow:var(--sh)}
.tabs button{flex:1;position:relative;z-index:1;border:0;background:none;padding:10px 0;color:var(--mut);font-weight:600}
.tabs button.on{color:var(--acon)}
#ind{position:absolute;left:4px;top:4px;bottom:4px;width:calc((100% - 8px)/3);background:var(--ac);border-radius:18px}
.fab{position:fixed;right:20px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;font-size:28px;padding:0;box-shadow:0 4px 14px #0003;z-index:5}
.hide{display:none!important}
#ov{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--sheet);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:0 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px}
#ov:not(.hide) .sheet{animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
.shh{touch-action:none;text-align:center;padding:8px 0 4px}.shh i{display:block;width:44px;height:5px;border-radius:3px;background:var(--mut);opacity:.45;margin:0 auto 8px}
label{display:block;color:var(--mut);font-size:13px}label input{margin-top:3px;color:var(--tx)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cats{display:flex;gap:6px}.cats button{flex:1;padding:7px 0}.cats button.on{color:var(--on);border-color:transparent}
.media{display:flex;gap:8px;flex-wrap:wrap}
.th{position:relative;width:72px;height:72px;border-radius:12px;overflow:hidden;background:var(--bd)}
.th img,.th video{width:100%;height:100%;object-fit:cover}
.th button{position:absolute;top:2px;right:2px;padding:0 6px;border-radius:10px;font-size:12px;background:#0007;color:#fff;border:0}
#lb{position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;z-index:20}
#lb img,#lb video{max-width:100%;max-height:100%}
</style></head>
<body>
<div id="app">
<div id="pages">
 <section class="pg" id="p0">
  <div class="hd"><h1 id="hi"></h1></div><p class="sub" id="hs"></p>
  <div class="card tc"><svg width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="none" stroke="var(--bd)" stroke-width="7"/><circle id="ring" cx="32" cy="32" r="26" fill="none" stroke="var(--ac)" stroke-width="7" stroke-linecap="round" stroke-dasharray="0 163.4" transform="rotate(-90 32 32)" style="transition:stroke-dasharray .6s"/><text id="rtx" x="32" y="37" text-anchor="middle" font-size="15" font-weight="700" fill="var(--tx)"></text></svg><div class="f1"><div class="big" id="rmsg"></div><div class="mut" id="rnx"></div></div></div>
  <h2>今日行程</h2><div id="dlist"></div>
  <h2 id="mh">今日筆記本</h2>
  <div class="add"><input id="mt" placeholder="今天想做的小事…"><button class="pri" id="madd">新增</button></div>
  <div id="mlist"></div>
 </section>
 <section class="pg" id="p1">
  <div class="hd"><h1 id="ttl"></h1><button id="prev">‹</button><button id="tod">今天</button><button id="next">›</button></div>
  <div class="card"><div class="wk"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>
  <div id="ms"><div class="mp" id="mp0"></div><div class="mp" id="mp1"></div><div class="mp" id="mp2"></div></div></div>
  <h2 id="adate"></h2><div id="alist"></div>
 </section>
 <section class="pg" id="p2">
  <div class="hd"><h1>待辦</h1></div><p class="sub" id="tc"></p>
  <div class="add d3"><input id="tt" placeholder="新增待辦…"><input id="td" type="date" style="width:auto"><button class="pri" id="tadd">新增</button></div>
  <div id="tl"></div>
 </section>
</div>
<nav class="tabs"><i id="ind"></i><button class="on">今日</button><button>月曆</button><button>待辦</button></nav>
</div>
<button class="pri fab" id="fab">＋</button>
<div id="ov" class="hide"><div class="sheet" id="sheet">
 <div class="shh" id="shh"><i></i><b id="sht">新增行程</b></div>
 <input id="f-title" placeholder="行程名稱">
 <input id="f-date" type="date">
 <div class="two"><label>開始時間<input id="f-time" type="time"></label><label>結束時間（選填）<input id="f-end" type="time"></label></div>
 <div class="cats" id="cats"></div>
 <select id="f-rep"><option value="">不重複</option><option value="d">每天重複</option><option value="w">每週重複（可選星期）</option><option value="m">每月重複</option><option value="y">每年重複</option></select>
 <div class="cats hide" id="wk-days"></div>
 <label class="hide" id="f-until-w">重複到哪天（選填，不填就一直重複）<input id="f-until" type="date"></label>
 <div class="add"><input id="f-loc" placeholder="地點（選填）"><button id="f-gps">📍 目前位置</button></div>
 <div class="mut" id="f-gmsg"></div>
 <div class="media" id="media"></div>
 <button id="f-add">📷 加照片或影片</button><input id="f-file" type="file" accept="image/*,video/*" multiple hidden>
 <textarea id="f-note" rows="2" placeholder="備註（選填）"></textarea>
 <div class="two"><button id="f-del" class="hide">刪除</button><button id="f-no">取消</button></div>
 <button class="pri" id="f-ok">儲存</button>
</div></div>
<div id="lb" class="hide"></div>
<script>
const CATS=[["學習","--c0"],["申請","--c1"],["運動","--c2"],["其他","--c3"]],WD="日一二三四五六";
const $=s=>document.querySelector(s);
let S={ev:[],td:[],mt:[]};
try{S=Object.assign(S,JSON.parse(localStorage.getItem("cal1"))||{})}catch(e){}
const save=()=>{try{localStorage.setItem("cal1",JSON.stringify(S))}catch(e){alert("儲存空間已滿")}};
const pad=n=>String(n).padStart(2,"0"),fmt=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()),today=()=>fmt(new Date());
const parse=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let cur=new Date(),sel=today(),editing=null,cat=0,wdays=[],media=[],added=[],removed=[],loc={},curIdx=1,dopen=false;cur.setDate(1);
/* media storage (IndexedDB) */
const idb=new Promise(r=>{try{const q=indexedDB.open("calmedia",1);q.onupgradeneeded=()=>q.result.createObjectStore("m");q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
const mput=async(id,b)=>{const d=await idb;if(!d)throw 0;return new Promise((y,n)=>{const t=d.transaction("m","readwrite");t.objectStore("m").put(b,id);t.oncomplete=y;t.onerror=n})};
const mget=async id=>{const d=await idb;if(!d)return null;return new Promise(y=>{const q=d.transaction("m").objectStore("m").get(id);q.onsuccess=()=>y(q.result);q.onerror=()=>y(null)})};
const mdel=async id=>{const d=await idb;if(d)d.transaction("m","readwrite").objectStore("m").delete(id)};
const shrink=f=>new Promise((y,n)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const k=Math.min(1,1280/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?y(b):n(),"image/jpeg",.8)};i.onerror=n;i.src=u});
/* events */
function occurs(e,d){if(e.date===d)return true;if(d<e.date||!e.rep||(e.until&&d>e.until))return false;const a=parse(e.date),b=parse(d);
 if(e.rep==="d")return true;
 if(e.rep==="w")return(e.days&&e.days.length?e.days:[a.getDay()]).includes(b.getDay());
 if(e.rep==="m")return a.getDate()===b.getDate();
 return a.getDate()===b.getDate()&&a.getMonth()===b.getMonth()}
const evOn=d=>S.ev.filter(e=>occurs(e,d)).sort((x,y)=>(x.time||"")<(y.time||"")?-1:1);
const mapUrl=l=>l.lat!=null?"https://www.google.com/maps?q="+l.lat+","+l.lng:"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(l.name);
function repLabel(e){return{d:"每天",w:"每週"+(e.days&&e.days.length>1?"（"+e.days.map(i=>WD[i]).join("、")+"）":""),m:"每月",y:"每年"}[e.rep]}
function evRow(e){const r=document.createElement("div");r.className="row";const p=[],n=(e.media||[]).length;
 if(e.end)p.push(e.time+"–"+e.end);if(e.rep)p.push(repLabel(e));
 if(e.loc&&(e.loc.name||e.loc.lat!=null))p.push('<a href="'+mapUrl(e.loc)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">📍 '+esc(e.loc.name||"地圖")+"</a>");
 if(n)p.push("📎 "+n);if(e.note)p.push(esc(e.note));
 r.innerHTML='<div class="tm">'+(e.time||"全天")+'</div><span class="bar2" style="background:var('+CATS[e.cat][1]+')"></span><div class="f1"><div>'+esc(e.title)+'</div>'+(p.length?'<div class="mut">'+p.join(" · ")+"</div>":"")+"</div>";
 r.onclick=()=>openEv(e);return r}
/* month */
function mgrid(y,m){const st=new Date(y,m,1-new Date(y,m,1).getDay()),t=today();let h="";
 for(let i=0;i<42;i++){const d=new Date(st.getFullYear(),st.getMonth(),st.getDate()+i),k=fmt(d),cs=[...new Set(evOn(k).map(e=>e.cat))].slice(0,3);
  h+='<div class="day'+(d.getMonth()!==m?" out":"")+(k===t?" today":"")+(k===sel?" sel":"")+'" data-d="'+k+'"><b>'+d.getDate()+'</b><div class="dots">'+cs.map(c=>'<s style="background:var('+CATS[c][1]+')"></s>').join("")+"</div></div>"}
 return h}
function renderMonth(){const y=cur.getFullYear(),m=cur.getMonth();$("#ttl").textContent=y+" 年 "+(m+1)+" 月";
 [-1,0,1].forEach((o,i)=>{const d=new Date(y,m+o,1);$("#mp"+i).innerHTML=mgrid(d.getFullYear(),d.getMonth())})}
function renderAgenda(){const d=parse(sel),es=evOn(sel),l=$("#alist");
 $("#adate").textContent=(d.getMonth()+1)+" 月 "+d.getDate()+" 日 週"+WD[d.getDay()]+(sel===today()?" · 今天":"");
 l.innerHTML=es.length?"":'<div class="empty">這天很空閒 🌿<br>按右下角 ＋ 安排點什麼</div>';es.forEach(e=>l.appendChild(evRow(e)))}
/* checklist rows */
function lrow(x,key,due){const r=document.createElement("div"),late=due&&!x.done&&x.due&&x.due<today();r.className="row"+(x.done?" done":"");
 r.innerHTML='<button class="ck'+(x.done?" on":"")+'">'+(x.done?"✓":"")+'</button><div class="f1"><div class="t">'+esc(x.text)+"</div>"+(due&&x.due?'<div class="mut" style="'+(late?"color:var(--warn)":"")+'">'+x.due+(late?" 已逾期":"")+"</div>":"")+'</div><button class="x">✕</button>';
 r.querySelector(".ck").onclick=()=>{x.done=!x.done;save();renderDay();renderTodos()};
 r.querySelector(".x").onclick=()=>{S[key]=S[key].filter(y=>y!==x);save();renderDay();renderTodos()};return r}
function renderDay(){const n=new Date(),t=fmt(n),h=n.getHours(),es=evOn(t),notes=S.mt.filter(x=>x.date===t),tds=S.td.filter(x=>x.due===t);
 const all=notes.length+tds.length,done=notes.filter(x=>x.done).length+tds.filter(x=>x.done).length,hm=pad(h)+":"+pad(n.getMinutes()),nx=es.find(e=>e.time&&e.time>=hm);
 $("#hi").textContent=h<5?"夜深了，早點休息 🌙":h<12?"早安 ☀️":h<18?"午安 🌿":"晚安 🌙";
 $("#hs").textContent=(n.getMonth()+1)+" 月 "+n.getDate()+" 日 週"+WD[n.getDay()];
 $("#ring").setAttribute("stroke-dasharray",(all?done/all:0)*163.4+" 163.4");$("#rtx").textContent=all?done+"/"+all:"0";
 $("#rmsg").textContent=!all?"從一件小事開始吧":done===all?"今天全部完成，真棒 🎉":"還剩 "+(all-done)+" 件，慢慢來";
 $("#rnx").textContent=nx?"下一個："+nx.time+" "+nx.title:es.length?"今天的行程都結束了":"今天沒有行程";
 const l=$("#dlist");l.innerHTML=es.length?"":'<div class="empty">今天沒有行程 ☁️</div>';es.forEach(e=>l.appendChild(evRow(e)));
 $("#mh").textContent="今日筆記本"+(notes.length?"（"+notes.filter(x=>x.done).length+"/"+notes.length+"）":"");
 const m=$("#mlist");m.innerHTML="";[...notes].sort((a,b)=>a.done-b.done).forEach(x=>m.appendChild(lrow(x,"mt")))}
function renderTodos(){const t=today(),op=S.td.filter(x=>!x.done),box=$("#tl");box.innerHTML="";
 $("#tc").textContent=op.length?op.length+" 件待完成":S.td.length?"全部完成 ✨":"";
 [["今天與逾期",op.filter(x=>x.due&&x.due<=t)],["之後",op.filter(x=>x.due>t)],["隨時",op.filter(x=>!x.due)]].forEach(([n,a])=>{if(!a.length)return;const h=document.createElement("h2");h.textContent=n;box.appendChild(h);a.sort((p,q)=>(p.due||"9")<(q.due||"9")?-1:1).forEach(x=>box.appendChild(lrow(x,"td",1)))});
 const dn=S.td.filter(x=>x.done);if(dn.length){const d=document.createElement("details");d.open=dopen;d.ontoggle=()=>dopen=d.open;d.innerHTML='<summary class="mut">已完成 '+dn.length+"</summary>";dn.forEach(x=>d.appendChild(lrow(x,"td",1)));box.appendChild(d)}
 if(!S.td.length)box.innerHTML='<div class="empty">還沒有待辦<br>寫下第一件吧</div>'}
const renderAll=()=>{renderMonth();renderAgenda();renderDay();renderTodos()};
/* add notes / todos */
$("#madd").onclick=()=>{const t=$("#mt").value.trim();if(!t)return;S.mt.push({id:Date.now(),text:t,done:false,date:today()});$("#mt").value="";save();renderDay()};
$("#tadd").onclick=()=>{const t=$("#tt").value.trim();if(!t)return;S.td.push({id:Date.now(),text:t,done:false,due:$("#td").value});$("#tt").value="";$("#td").value="";save();renderDay();renderTodos()};
[["#mt","#madd"],["#tt","#tadd"]].forEach(([a,b])=>$(a).addEventListener("keydown",e=>{if(e.key==="Enter")$(b).click()}));
/* native-style paging: scroll-snap gives real iOS momentum, rubber-band and flick */
const P=$("#pages"),MS=$("#ms"),tabs=[...document.querySelectorAll(".tabs button")];
function snap(el,i){el.style.scrollSnapType="none";el.scrollLeft=i*el.clientWidth;requestAnimationFrame(()=>el.style.scrollSnapType="")}
const center=()=>snap(MS,1);
P.addEventListener("scroll",()=>{const p=P.scrollLeft/P.clientWidth,i=Math.round(p);$("#ind").style.transform="translateX("+p*100+"%)";
 if(i!==curIdx){curIdx=i;tabs.forEach((b,j)=>b.classList.toggle("on",j===i));$("#fab").classList.toggle("hide",i===2)}},{passive:true});
tabs.forEach((b,i)=>b.onclick=()=>P.scrollTo({left:i*P.clientWidth,behavior:"smooth"}));
let settle;MS.addEventListener("scroll",()=>{clearTimeout(settle);settle=setTimeout(()=>{const i=Math.round(MS.scrollLeft/MS.clientWidth);if(i!==1){cur=new Date(cur.getFullYear(),cur.getMonth()+i-1,1);renderMonth();center()}},90)},{passive:true});
MS.addEventListener("click",e=>{const c=e.target.closest(".day");if(!c)return;sel=c.dataset.d;const d=parse(sel);if(d.getMonth()!==cur.getMonth()){cur=new Date(d.getFullYear(),d.getMonth(),1);renderMonth();center()}else renderMonth();renderAgenda()});
$("#prev").onclick=()=>MS.scrollTo({left:0,behavior:"smooth"});
$("#next").onclick=()=>MS.scrollTo({left:2*MS.clientWidth,behavior:"smooth"});
$("#tod").onclick=()=>{sel=today();cur=new Date();cur.setDate(1);renderMonth();center();renderAgenda()};
addEventListener("resize",()=>{snap(P,curIdx);center()});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)renderAll()});
/* event sheet */
function setCat(i){cat=i;[...$("#cats").children].forEach((b,j)=>{b.className=j===i?"on":"";b.style.background=j===i?"var("+CATS[j][1]+")":""})}
CATS.forEach((c,i)=>{const b=document.createElement("button");b.textContent=c[0];b.onclick=()=>setCat(i);$("#cats").appendChild(b)});
[...WD].forEach((t,i)=>{const b=document.createElement("button");b.textContent=t;b.onclick=()=>{wdays=wdays.includes(i)?wdays.filter(x=>x!==i):[...wdays,i];paintDays()};$("#wk-days").appendChild(b)});
function paintDays(){[...$("#wk-days").children].forEach((b,i)=>{const on=wdays.includes(i);b.className=on?"on":"";b.style.background=on?"var(--ac)":"";b.style.color=on?"var(--acon)":""})}
function repUI(){const r=$("#f-rep").value;$("#wk-days").classList.toggle("hide",r!=="w");$("#f-until-w").classList.toggle("hide",!r)}
$("#f-rep").onchange=()=>{if($("#f-rep").value==="w"&&!wdays.length){wdays=[parse($("#f-date").value||sel).getDay()];paintDays()}repUI()};
const urls={};
function paintMedia(){const box=$("#media");box.innerHTML="";media.forEach(async m=>{const d=document.createElement("div");d.className="th";box.appendChild(d);
 const b=await mget(m.id);if(!b){d.textContent="?";return}
 const u=urls[m.id]||(urls[m.id]=URL.createObjectURL(b));
 d.innerHTML=(m.t==="vid"?'<video src="'+u+'#t=0.1" muted playsinline preload="metadata"></video>':'<img src="'+u+'">')+"<button>✕</button>";
 d.onclick=ev=>{if(ev.target.tagName==="BUTTON"){media=media.filter(x=>x!==m);removed.push(m.id);paintMedia()}else{$("#lb").innerHTML=m.t==="vid"?'<video src="'+u+'" controls autoplay playsinline></video>':'<img src="'+u+'">';$("#lb").classList.remove("hide")}}})}
$("#lb").onclick=e=>{if(e.target.tagName!=="VIDEO"){$("#lb").classList.add("hide");$("#lb").innerHTML=""}};
$("#f-add").onclick=()=>$("#f-file").click();
$("#f-file").onchange=async ev=>{for(const f of ev.target.files){try{const vid=f.type.startsWith("video"),id="m"+Date.now()+Math.random().toString(36).slice(2,6);await mput(id,vid?f:await shrink(f));media.push({id,t:vid?"vid":"img"});added.push(id)}catch(e){alert("這個檔案無法加入："+f.name)}}ev.target.value="";paintMedia()};
$("#f-gps").onclick=()=>{const b=$("#f-gps");if(!navigator.geolocation){alert("這個裝置不支援定位");return}b.textContent="定位中…";
 navigator.geolocation.getCurrentPosition(p=>{loc.lat=+p.coords.latitude.toFixed(5);loc.lng=+p.coords.longitude.toFixed(5);if(!$("#f-loc").value.trim())$("#f-loc").value="目前位置";b.textContent="📍 已定位"},()=>{b.textContent="📍 目前位置";alert("無法取得位置，請到設定允許網站使用位置")},{timeout:10000})};
function openEv(e){editing=e||null;added=[];removed=[];$("#sht").textContent=e?"編輯行程":"新增行程";
 $("#f-title").value=e?e.title:"";$("#f-date").value=e?e.date:sel;$("#f-time").value=e&&e.time||"";$("#f-end").value=e&&e.end||"";
 $("#f-rep").value=e&&e.rep||"";wdays=e&&e.days?[...e.days]:[];if(e&&e.rep==="w"&&!wdays.length)wdays=[parse(e.date).getDay()];
 $("#f-until").value=e&&e.until||"";$("#f-note").value=e&&e.note||"";
 loc=e&&e.loc?{...e.loc}:{};$("#f-loc").value=loc.name||"";$("#f-gps").textContent=loc.lat!=null?"📍 已定位":"📍 目前位置";
 media=e&&e.media?[...e.media]:[];setCat(e?e.cat:0);repUI();paintDays();paintMedia();
 $("#f-del").classList.toggle("hide",!e);$("#ov").classList.remove("hide");if(!e)$("#f-title").focus()}
const closeEv=()=>{added.forEach(mdel);added=[];$("#ov").classList.add("hide")};
$("#f-no").onclick=closeEv;
$("#f-ok").onclick=()=>{const title=$("#f-title").value.trim(),date=$("#f-date").value;if(!title||!date){$("#f-title").focus();return}
 const rep=$("#f-rep").value,nm=$("#f-loc").value.trim(),o={title,date,time:$("#f-time").value,end:$("#f-end").value,cat,rep,days:rep==="w"?[...wdays]:[],until:rep?$("#f-until").value:"",note:$("#f-note").value.trim(),loc:(nm||loc.lat!=null)?{name:nm,lat:loc.lat,lng:loc.lng}:null,media:[...media]};
 if(o.end&&o.time&&o.end<=o.time)o.end="";
 if(editing)Object.assign(editing,o);else S.ev.push({id:Date.now(),...o});
 removed.forEach(mdel);added=[];save();$("#ov").classList.add("hide");sel=date;cur=parse(date);cur.setDate(1);renderAll();center()};
$("#f-del").onclick=()=>{if(!confirm("刪除這個行程？"))return;(editing.media||[]).forEach(m=>mdel(m.id));added.forEach(mdel);added=[];S.ev=S.ev.filter(x=>x!==editing);save();$("#ov").classList.add("hide");renderAll()};
$("#fab").onclick=()=>{if(curIdx===0)sel=today();openEv(null)};
(function(){const sh=$("#sheet"),h=$("#shh");let y0=null,dy=0;
 h.addEventListener("touchstart",e=>{y0=e.touches[0].clientY;dy=0;sh.style.transition="none"},{passive:true});
 h.addEventListener("touchmove",e=>{if(y0===null)return;dy=Math.max(0,e.touches[0].clientY-y0);sh.style.transform="translateY("+dy+"px)"},{passive:true});
 const end=()=>{if(y0===null)return;y0=null;const far=dy>110;dy=0;sh.style.transition="transform .22s ease-out";sh.style.transform=far?"translateY(100%)":"";if(far)setTimeout(()=>{closeEv();sh.style.transform="";sh.style.transition=""},200)};
 h.addEventListener("touchend",end);h.addEventListener("touchcancel",end);
 $("#ov").addEventListener("click",e=>{if(e.target===$("#ov"))closeEv()})})();
(function(){const sh=$("#sheet");let x0=null,y0=null,m=null,dx=0;
 sh.addEventListener("touchstart",e=>{if(e.target.closest("input,textarea,select")){m="n";x0=null;return}const t=e.touches[0];x0=t.clientX;y0=t.clientY;m=null;dx=0},{passive:true});
